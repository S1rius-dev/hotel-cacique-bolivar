name: CI

# Validación del monorepo. No despliega nada: este repositorio es una
# demostración pública y no contiene secretos ni infraestructura de producción.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 21 + Maven)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compilar y probar
        # Perfil `test` (H2 en memoria) configurado en el surefire del pom.
        run: ./mvnw -B -ntp clean verify

  frontend:
    name: Frontend (Node 22 + pnpm)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint
        continue-on-error: true

      - name: Compilar
        # Sin backend en CI el cliente Orval no se regenera: se compila el ya
        # versionado en src/api/generated/. El prerender corre sin navegador.
        run: pnpm build
        env:
          PRERENDER_NO_BROWSER: "1"
