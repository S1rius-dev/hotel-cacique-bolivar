# Perfil DEV — MySQL local + .env
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:hotelcaciquebolivar}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=America/Bogota&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: ${HIBERNATE_FORMAT_SQL:false}
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

logging:
  level:
    org.hibernate.SQL: ${LOG_LEVEL_SQL:debug}
    org.hibernate.type.descriptor.sql.BasicBinder: ${LOG_LEVEL_BINDER:trace}
    com.hotelcaciquebolivar: debug
    com.hotelcaciquebolivar.reservas.service.payment: debug
    com.hotelcaciquebolivar.reservas.service.payment.gateway.wompi: debug
    com.hotelcaciquebolivar.reservas.service.payment.gateway.bold: debug

app:
  cookie:
    secure: false
  payments:
    wompi:
      base-url: ${WOMPI_BASE_URL:https://sandbox.wompi.co/v1}
    bold:
      base-url: ${BOLD_BASE_URL:https://sandbox.bold.co}
  # Copias de seguridad: se activan con BACKUP_ENABLED=true y MYSQLDUMP_PATH en el .env.
  # mysqldump no suele estar en PATH en Windows; usar la ruta completa, p.ej.
  # MYSQLDUMP_PATH=C:/Program Files/MySQL/MySQL Server 8.0/bin/mysqldump.exe
  backup:
    enabled: ${BACKUP_ENABLED:false}
    storage:
      dir: ${BACKUP_STORAGE_DIR:./backups}
