# Perfil PROD — MySQL/MariaDB producción + variables de entorno Windows Server
# Sin defaults para secretos: debe fallar si faltan variables críticas
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=America/Bogota&createDatabaseIfNotExist=false
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    validate-on-migrate: true
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

logging:
  level:
    root: warn
    org.hibernate.SQL: warn
    org.hibernate.type.descriptor.sql.BasicBinder: warn
    com.hotelcaciquebolivar: info
    com.hotelcaciquebolivar.reservas.service.payment: info
    com.hotelcaciquebolivar.reservas.service.payment.gateway.wompi: info
    com.hotelcaciquebolivar.reservas.service.payment.gateway.bold: info

app:
  cookie:
    secure: true
  payments:
    wompi:
      base-url: ${WOMPI_BASE_URL:https://production.wompi.co/v1}
    bold:
      base-url: ${BOLD_BASE_URL:https://api.bold.co}
  # Copias de seguridad. Sin defaults intencionalmente: definir BACKUP_ENABLED,
  # MYSQLDUMP_PATH, BACKUP_SCHEDULE_CRON y BACKUP_STORAGE_DIR en las variables de
  # entorno de Windows Server. Ver docs/backup-runbook.md.
