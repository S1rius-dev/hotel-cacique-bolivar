<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <title th:remove="all">Hotel Cacique Bolívar</title>
</head>
<body style="margin:0;padding:0;background-color:#fafaf9;font-family:Inter,'Segoe UI',Arial,sans-serif;">

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#fafaf9;">
    <tr>
      <td align="center" style="padding:24px 10px;">

        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;">

          <!-- HEADER -->
          <tr th:fragment="header">
            <td style="background-color:#ffffff;border-radius:12px 12px 0 0;padding:32px 24px 20px;text-align:center;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="text-align:center;padding-bottom:16px;">
                    <img src="cid:logo" alt="Hotel Cacique Bolívar" style="max-height:64px;width:auto;border:0;outline:none;" />
                  </td>
                </tr>
                <tr>
                  <td style="border-bottom:1px solid #e5e7eb;height:1px;line-height:1px;font-size:1px;">&nbsp;</td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- BADGE -->
          <tr th:fragment="badge(texto)">
            <td style="background-color:#ffffff;padding:0 24px;text-align:center;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="text-align:center;padding-bottom:4px;">
                    <span style="display:inline-block;background-color:#fff1f2;color:#e11d48;padding:6px 18px;border-radius:20px;font-size:12px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;" th:text="${texto}">BADGE</span>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- CONTENT -->
          <tr>
            <td style="background-color:#ffffff;padding:0 24px 20px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="font-size:15px;line-height:1.7;color:#57534e;">
                    <!-- contenido específico de cada plantilla -->
                    <th:block th:include="${template} :: content" />
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- BUTTON -->
          <tr th:fragment="button(url,texto)">
            <td style="background-color:#ffffff;padding:0 24px 32px;text-align:center;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td align="center">
                    <table role="presentation" cellpadding="0" cellspacing="0" style="border-radius:8px;">
                      <tr>
                        <td style="background-color:#e11d48;border-radius:8px;text-align:center;">
                          <a th:href="${url}" target="_blank" style="display:inline-block;padding:12px 28px;font-size:14px;font-family:Inter,'Segoe UI',Arial,sans-serif;color:#ffffff;text-decoration:none;font-weight:600;border-radius:8px;letter-spacing:0.3px;">[[${texto}]]</a>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- FOOTER -->
          <tr th:fragment="footer">
            <td style="background-color:#ffffff;border-radius:0 0 12px 12px;padding:0 24px 28px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="border-top:1px solid #e5e7eb;padding-top:20px;text-align:center;">
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                      <tr>
                        <td style="padding-bottom:4px;">
                          <img src="cid:logo" alt="Hotel Cacique Bolívar" style="max-height:32px;width:auto;border:0;outline:none;opacity:0.6;" />
                        </td>
                      </tr>
                      <tr>
                        <td style="color:#292524;font-size:13px;font-weight:600;padding-bottom:6px;font-family:Inter,'Segoe UI',Arial,sans-serif;">Hotel Cacique Bolívar</td>
                      </tr>
                      <tr>
                        <td style="color:#a8a29e;font-size:12px;line-height:1.8;font-family:Inter,'Segoe UI',Arial,sans-serif;">
                          <span th:if="${hotelDireccion}">[[${hotelDireccion}]]<br></span>
                          <span th:if="${hotelTelefono}">Tel: [[${hotelTelefono}]]</span>
                          <span th:if="${hotelTelefono != null && hotelEmail != null}">&nbsp;&nbsp;|&nbsp;&nbsp;</span>
                          <span th:if="${hotelEmail}">[[${hotelEmail}]]</span>
                        </td>
                      </tr>
                      <tr>
                        <td style="color:#a8a29e;font-size:11px;padding-top:12px;font-family:Inter,'Segoe UI',Arial,sans-serif;">
                          &copy; [[${anioActual}]] Hotel Cacique Bolívar. Todos los derechos reservados.
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>

</body>
</html>
